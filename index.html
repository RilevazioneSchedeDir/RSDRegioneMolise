<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="theme-color" content="#06c"/>
<title>Scheda Complessit&agrave; Organizzativa | Regione Molise</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--p:#06c;--pd:#004080;--pl:#e8f0fe;--ac:#c8a84c;--ok:#008758;--ok-bg:#e6f4ed;--wa:#a66300;--wa-bg:#fff3cd;--no:#d9364f;--no-bg:#fef2f4;--n1:#17324d;--n2:#5c6f82;--n3:#d9dadb;--n4:#e8ecf1;--n5:#f5f7f9;--font:'Titillium Web',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--n5);color:var(--n1);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:var(--font)}
a{color:var(--p);text-decoration:none}
.hs{background:var(--pd);font-size:12px;color:rgba(255,255,255,.7);padding:5px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hm{background:var(--p);border-bottom:4px solid var(--ac);padding:14px 24px;display:flex;align-items:center;gap:16px}
.hm .logo{height:52px;flex-shrink:0}
.hm h1{color:#fff;font-size:17px;font-weight:700;line-height:1.2}
.hm p{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px}
.hn{background:#fff;border-bottom:1px solid var(--n4);position:sticky;top:0;z-index:100;padding:0 24px;display:flex;align-items:center;overflow-x:auto}
.ni{padding:12px 18px;font-size:14px;font-weight:600;color:var(--n2);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}
.ni:hover{color:var(--p)}.ni.ac{color:var(--p);border-bottom-color:var(--p)}
.ctr{max-width:100%;margin:0 auto;padding:20px 24px}
.cd{background:#fff;border:1px solid var(--n4);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.cd-h{padding:12px 18px;font-weight:700;font-size:14px;border-bottom:1px solid var(--n4);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cd-b{padding:18px}
.bg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bg-ok{background:var(--ok-bg);color:var(--ok)}.bg-no{background:var(--no-bg);color:var(--no)}.bg-wa{background:var(--wa-bg);color:var(--wa)}.bg-p{background:var(--pl);color:var(--p)}.bg-n{background:var(--n5);color:var(--n2)}
.bt{padding:10px 20px;border-radius:4px;font-weight:600;font-size:14px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;line-height:1.2}
.bt-p{background:var(--p);color:#fff}.bt-p:hover{background:var(--pd)}
.bt-s{background:var(--ok);color:#fff}.bt-s:hover{background:#006c46}
.bt-d{background:var(--no);color:#fff}.bt-d:hover{background:#b82d42}
.bt-o{background:none;border:1.5px solid var(--p);color:var(--p)}.bt-o:hover{background:var(--pl)}
.bt-g{background:none;border:1.5px solid var(--n3);color:var(--n2)}.bt-g:hover{background:var(--n5)}
.bt-sm{padding:6px 14px;font-size:12px}.bt-xs{padding:4px 10px;font-size:11px;border-radius:3px}
.fg{margin-bottom:14px}.fl{display:block;font-weight:600;font-size:13px;color:var(--n2);margin-bottom:3px}
.fc{width:100%;padding:9px 12px;border:1.5px solid var(--n3);border-radius:4px;font-size:14px;background:#fff;transition:border .15s}
.fc:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(0,102,204,.12);outline:none}
.fc-sm{padding:7px 10px;font-size:13px}
textarea.fc{resize:vertical;min-height:38px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{background:var(--p);color:#fff;padding:9px 12px;font-weight:600;text-align:left}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--n4)}.tbl tr:hover td{background:var(--pl)}
.tf{width:100%;border-collapse:collapse;font-size:13px}
.tf th{background:var(--pl);color:var(--pd);padding:8px 10px;font-weight:600;text-align:left;border:1px solid var(--n4)}
.tf td{padding:5px 7px;border:1px solid var(--n4);vertical-align:top}
.tf input,.tf select,.tf textarea{width:100%;padding:5px 7px;border:1.5px solid var(--n3);border-radius:4px;font-size:12px;font-family:var(--font)}
.tf input:focus,.tf select:focus,.tf textarea:focus{border-color:var(--p);outline:none}
.st{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:11px 18px;font-weight:700;font-size:14px;border-radius:8px 8px 0 0;margin-top:18px}
.sb{background:#fff;border:1px solid var(--n4);border-top:none;padding:16px 18px;border-radius:0 0 8px 8px}
.ss{font-weight:700;font-size:13px;color:var(--pd);margin:12px 0 6px;padding-bottom:5px;border-bottom:2px solid var(--pl)}
.prg{height:10px;background:var(--n4);border-radius:5px;overflow:hidden}
.prg-bar{height:100%;border-radius:5px;transition:width .4s}
.kpi{background:#fff;border:1px solid var(--n4);border-radius:8px;padding:16px;text-align:center}
.kpi-v{font-size:28px;font-weight:700;line-height:1}.kpi-l{font-size:11px;color:var(--n2);margin-top:3px}
.mo{position:fixed;inset:0;background:rgba(23,50,77,.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}
.mo-box{background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.12);width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.mo-h{padding:16px 22px;border-bottom:1px solid var(--n4);font-weight:700;font-size:16px;color:var(--pd)}
.mo-b{padding:18px 22px}
.rp{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border:1.5px solid var(--n4);border-radius:4px;margin-bottom:5px;cursor:pointer;transition:all .15s}
.rp:hover,.rp.sel{border-color:var(--p);background:var(--pl)}
.rp input{margin-top:3px;accent-color:var(--p)}
.toast{position:fixed;top:16px;right:16px;z-index:9999;padding:12px 22px;border-radius:4px;font-weight:600;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.08);animation:si .3s ease}
@keyframes si{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.si{padding:10px 14px;border-bottom:1px solid var(--n4);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s}
.si:hover{background:var(--pl)}.si:last-child{border-bottom:none}
.sc{font-weight:700;font-size:12px;color:var(--p);background:var(--pl);padding:2px 8px;border-radius:3px;flex-shrink:0;min-width:65px;text-align:center}
.sn{flex:1;font-size:13px;line-height:1.3}
.ftr{background:var(--n1);color:rgba(255,255,255,.4);border-top:4px solid var(--ac);padding:16px 24px;font-size:11px;text-align:center;line-height:1.8}
.ftr a{color:rgba(255,255,255,.6)}.ftr strong{color:rgba(255,255,255,.7)}
.grid-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
@media(max-width:768px){.ctr{padding:12px}.cd-b,.sb{padding:12px}.ni{padding:10px 10px;font-size:12px}.kpi-v{font-size:20px}.hm{padding:10px 16px;gap:10px}.hm h1{font-size:14px}.hm .logo{height:40px}}
</style>
</head><body><div id="root"></div>

window.API_URL="https://script.google.com/macros/s/AKfycbxdQUDaiAO9XaJGOdu4FjF1H00Gj58NrUKAFa493gp9TLpjcpBJcotBoon_0NSvEpGl/exec"; // INCOLLA URL APPS SCRIPT
window.RECOVERY_EMAIL="griguoli.giuseppe@gmail.com";
window.SK_PREFIX="sco_molise_";
window._SUBS=[];window._syncing=false;

window._hash=function(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h}return"h"+Math.abs(h).toString(36)};
window._ps=function(t){if(!t)return"";return String(t).replace(/[^\x20-\x7E\xA0-\xFF\n]/g,"")};
window._getYear=function(){try{return parseInt(localStorage.getItem("sco_active_year"))||2026}catch(e){return 2026}};
window._setYear=function(yr){try{localStorage.setItem("sco_active_year",String(yr))}catch(e){}};
window._getSK=function(yr){return window.SK_PREFIX+(yr||window._getYear())};
window._saveLocal=function(s,yr){window._SUBS=s;try{localStorage.setItem(window._getSK(yr),JSON.stringify(s))}catch(e){}};

// ═══ CLOUD via POST (supporta testi lunghi, nessun limite URL) ═══
window._cloudPost=function(body,cb){
  if(!window.API_URL){if(cb)cb(null);return}
  fetch(window.API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body),redirect:"follow"})
  .then(function(r){return r.json()}).then(function(d){if(cb)cb(d)}).catch(function(e){console.error("Cloud error:",e);if(cb)cb(null)});
};
window._cloudGet=function(action,params,cb){
  if(!window.API_URL){if(cb)cb(null);return}
  var qs="action="+action;if(params)Object.keys(params).forEach(function(k){qs+="&"+k+"="+encodeURIComponent(params[k])});
  fetch(window.API_URL+"?"+qs+"&t="+Date.now()).then(function(r){return r.json()}).then(function(d){if(cb)cb(d)}).catch(function(){if(cb)cb(null)});
};

// Save entry to cloud via POST (handles large data)
window._cloudSave=function(entry,cb){
  window._syncing=true;window.dispatchEvent(new Event("syncStatus"));
  window._cloudPost({action:"upsert",entry:entry},function(r){
    window._syncing=false;window.dispatchEvent(new Event("syncStatus"));
    if(cb)cb(r&&r.ok);
  });
};
window._cloudDelete=function(id,yr){
  window._cloudPost({action:"deleteEntry",id:id,year:yr||window._getYear()},function(){});
};
window._cloudSaveUsers=function(u){
  window._cloudPost({action:"saveUsers",users:u},function(){});
};
window._sendEmail=function(name,email,pwd,cb){
  window._cloudPost({action:"sendPassword",name:name,email:email,pwd:pwd},function(d){if(cb)cb(d&&d.ok)});
};

// ═══ LOAD: cloud-first, fallback locale ═══
window._loadFromCloud=function(yr,cb){
  var k=window._getSK(yr);
  var local=[];try{var d=JSON.parse(localStorage.getItem(k)||"null");if(d&&Array.isArray(d))local=d}catch(e){}
  if(!window.API_URL){window._SUBS=local;if(cb)cb(local);return}
  window._syncing=true;window.dispatchEvent(new Event("syncStatus"));
  window._cloudGet("load",{year:yr||window._getYear()},function(cd){
    window._syncing=false;window.dispatchEvent(new Event("syncStatus"));
    if(cd&&Array.isArray(cd)){
      // Cloud wins. Push any local-only entries to cloud
      var cloudIds={};cd.forEach(function(e){if(e&&e.id)cloudIds[e.id]=true});
      local.forEach(function(e){if(e&&e.id&&!cloudIds[e.id]){cd.push(e);window._cloudSave(e)}});
      window._SUBS=cd;try{localStorage.setItem(k,JSON.stringify(cd))}catch(e){}
      window.dispatchEvent(new Event("subsChanged"));
      if(cb)cb(cd);
    } else {window._SUBS=local;if(cb)cb(local)}
  });
};
